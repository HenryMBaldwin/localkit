global
    log stdout format raw local0
    maxconn 128
defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 10m
    timeout server 10m
frontend device_tls
    bind :443 ssl crt /tls/proxy.pem
    bind :8883 ssl crt /tls/proxy.pem
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.len gt 0 }
    use_backend bootstrap_tcp if { req.payload(0,3) -m str GET }
    use_backend bootstrap_tcp if { req.payload(0,4) -m str POST }
    default_backend mqtt
backend mqtt
    server mqtt mqtt-bridge:1883
backend bootstrap_tcp
    server http 127.0.0.1:8080
frontend device_http
    bind :80
    bind 127.0.0.1:8080
    mode http
    log-format "device %ci %ST %HP"
    acl bootstrap path_reg ^/6/d4h/(dev_signup|dev_syncTime|dev_serverinfo|dev_only_iot_device_info|dev_only_iot_device_info_v2)$
    acl heartbeat path_reg ^/6/poll/[^/]+/heartbeat$
    http-request deny unless bootstrap or heartbeat
    default_backend local_http
backend local_http
    mode http
    server http localkit:80
